name: Kesit APK

on:
  push:
    paths:
      - "kesit/**"
      - ".github/workflows/kesit-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK
        run: |
          set -o pipefail
          gradle --project-dir kesit assembleDebug --no-daemon 2>&1 | tee -a build.log

      - name: Release APK
        env:
          KESIT_KEYSTORE_B64: ${{ secrets.KESIT_KEYSTORE_B64 }}
          KESIT_KEYSTORE_PASSWORD: ${{ secrets.KESIT_KEYSTORE_PASSWORD }}
          KESIT_KEY_ALIAS: ${{ secrets.KESIT_KEY_ALIAS }}
          KESIT_KEY_PASSWORD: ${{ secrets.KESIT_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --project-dir kesit assembleRelease --no-daemon 2>&1 | tee -a build.log

      # Gradle'in yigin izleri loglari bogdugu icin asil derleyici hatalarini
      # ayrica ve en sona yazdiriyoruz.
      - name: Hata ozeti
        if: failure()
        run: |
          echo "=================== DERLEYICI HATALARI ==================="
          grep -nE "^(e: |error: )" build.log | head -80 || echo "(derleyici hatasi satiri yok)"
          echo "=================== NE TERS GITTI ======================="
          awk '/\* What went wrong:/,/\* Try:/' build.log | head -40 || true

      - name: APK'lari yukle
        uses: actions/upload-artifact@v4
        with:
          name: kesit-apk
          if-no-files-found: error
          path: |
            kesit/app/build/outputs/apk/debug/*.apk
            kesit/app/build/outputs/apk/release/*.apk
