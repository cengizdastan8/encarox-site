name: Kesit APK

on:
  push:
    paths:
      - "kesit/**"
      - ".github/workflows/kesit-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner imajinda Android SDK ve kabul edilmis lisanslar hazir geliyor;
      # ANDROID_HOME imaj seviyesinde tanimli. Ayrica bir kurulum eylemi
      # kullanmiyoruz: sdkmanager'i her imaj degisiminde kirilabiliyor.
      - name: Android SDK'yi dogrula
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK
        run: |
          set -o pipefail
          gradle --project-dir kesit assembleDebug --no-daemon 2>&1 | tee -a build.log

      - name: Release APK
        env:
          KESIT_KEYSTORE_B64: ${{ secrets.KESIT_KEYSTORE_B64 }}
          KESIT_KEYSTORE_PASSWORD: ${{ secrets.KESIT_KEYSTORE_PASSWORD }}
          KESIT_KEY_ALIAS: ${{ secrets.KESIT_KEY_ALIAS }}
          KESIT_KEY_PASSWORD: ${{ secrets.KESIT_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --project-dir kesit assembleRelease --no-daemon 2>&1 | tee -a build.log

      # Gradle'in yigin izleri loglari bogdugu icin asil derleyici hatalarini
      # ayrica ve en sona yazdiriyoruz.
      - name: Hata ozeti
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "Derleme hic baslamadi; hata yukaridaki adimda."
            exit 0
          fi
          echo "=================== DERLEYICI HATALARI ==================="
          grep -nE "^(e: |error: )" build.log | head -80 || echo "(derleyici hatasi satiri yok)"
          echo "=================== NE TERS GITTI ======================="
          awk '/\* What went wrong:/,/\* Try:/' build.log | head -40 || true

      - name: APK'lari yukle
        uses: actions/upload-artifact@v4
        with:
          name: kesit-apk
          if-no-files-found: error
          path: |
            kesit/app/build/outputs/apk/debug/*.apk
            kesit/app/build/outputs/apk/release/*.apk

      # Actions arsivi zip halinde ve indirmek icin oturum gerektiriyor.
      # Surum varligi ise sabit, dogrudan bir .apk adresi veriyor: telefonun
      # tarayicisindan tiklayip kurabilmek icin bu gerekli.
      - name: Son APK surumunu guncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp kesit/app/build/outputs/apk/release/app-release.apk dist/kesit.apk
          cp kesit/app/build/outputs/apk/debug/app-debug.apk dist/kesit-debug.apk
          printf '%s\n' \
            "Kesit video kesme uygulamasinin en son derlemesi." \
            "" \
            "Telefona kurmak icin kesit.apk dosyasini indir ve kur." \
            "Release surumu takilirsa kesit-debug.apk her zaman calisir." \
            "" \
            "Derleme: $GITHUB_SHA" > notes.md
          if gh release view kesit-latest >/dev/null 2>&1; then
            gh release upload kesit-latest dist/kesit.apk dist/kesit-debug.apk --clobber
            gh release edit kesit-latest --notes-file notes.md
          else
            gh release create kesit-latest dist/kesit.apk dist/kesit-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Kesit - son APK" \
              --notes-file notes.md
          fi
