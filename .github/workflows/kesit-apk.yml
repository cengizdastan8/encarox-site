name: Kesit APK

on:
  push:
    paths:
      - "kesit/**"
      - ".github/workflows/kesit-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK
        run: gradle --project-dir kesit assembleDebug --no-daemon --stacktrace

      - name: Release APK
        env:
          KESIT_KEYSTORE_B64: ${{ secrets.KESIT_KEYSTORE_B64 }}
          KESIT_KEYSTORE_PASSWORD: ${{ secrets.KESIT_KEYSTORE_PASSWORD }}
          KESIT_KEY_ALIAS: ${{ secrets.KESIT_KEY_ALIAS }}
          KESIT_KEY_PASSWORD: ${{ secrets.KESIT_KEY_PASSWORD }}
        run: gradle --project-dir kesit assembleRelease --no-daemon --stacktrace

      - name: APK'lari yukle
        uses: actions/upload-artifact@v4
        with:
          name: kesit-apk
          if-no-files-found: error
          path: |
            kesit/app/build/outputs/apk/debug/*.apk
            kesit/app/build/outputs/apk/release/*.apk
